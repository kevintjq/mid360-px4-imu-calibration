# C++ LI-Init-style online calibration parameters.
mid_imu_topic: "/livox/imu"
body_imu_topic: "/mavros/imu/data_raw"
lidar_topic: "/livox/lidar"

# ROS-side convention: MAVROS publishes the IMU in the ROS body frame
# (normally base_link / FLU); ROS local/world coordinates are ENU. No extra
# NED/FRD conversion is applied by this node.

# Convert raw topic units to SI units before calibration.
# Use 9.80665 if the corresponding accelerometer publishes in g.
# Livox built-in IMU commonly reports acceleration in g. If `rostopic echo`
# shows approximately 9.8 while stationary, change this back to 1.0.
mid_accel_scale: 9.80665
body_accel_scale: 1.0
mid_gyro_scale: 1.0
body_gyro_scale: 1.0

# Output paths are relative to this package unless absolute paths are used.
output_yaml: "config/online_calibration_result.yaml"
output_txt: "config/online_calibration_result.txt"

# LI-Init-style automatic collection: initial static period, then three
# sequential excitation stages. X reaches 100% before Y starts, and Y reaches
# 100% before Z starts. The default timeout is zero: wait indefinitely instead
# of running a calibration with insufficient motion.
static_duration_s: 5.0
motion_timeout_s: 0.0
motion_update_period_s: 0.25
axis_excitation_target_rad: 1.2
min_samples: 500
min_lidar_scans: 15
lidar_voxel_size_m: 0.20
lidar_max_correspondence_m: 2.0
lidar_icp_iterations: 12
lidar_max_points_per_scan: 1200
max_lidar_icp_error_m: 0.25

time_search_min_s: -0.5
time_search_max_s: 0.5
time_search_step_s: 0.005
use_ansi_progress: true
